<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - 魔法問答小測驗</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../effects.css">
    <link rel="stylesheet" href="game.css">
</head>

<body class="lab stage-5">
    <div class="window" style="max-width: 700px; padding: 30px;">
        <h1 class="lab-title">📝 魔法問答小測驗</h1>

        <div id="quiz-container">
            <!-- 進度條 -->
            <div class="progress-container hidden" id="quiz-progress-bar">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <!-- 開始測驗畫面 -->
            <div id="start-screen" class="screen">
                <div class="quiz-icon">✨🏫✨</div>
                <h2 class="game-title">智慧知識挑戰</h2>
                <p class="game-desc">歡迎來到魔法問答室！<br>準備好接受挑戰，測試你的智慧極限了嗎？🎒</p>
                <button id="start-btn" class="play-btn" style="margin: 20px auto 0;">開始挑戰</button>
            </div>

            <!-- 測驗進行畫面 -->
            <div id="quiz-screen" class="screen hidden">
                <div class="quiz-header">
                    <span class="quiz-progress-text" id="progress-text">第 1 / 3 題</span>
                    <span class="quiz-score-text" id="score-text">得分: 0</span>
                </div>

                <!-- 問題題目 -->
                <div class="question-box">
                    <h3 id="question-text">題目載入中...</h3>
                </div>

                <!-- 選項列表 -->
                <div id="options-container" class="options-list">
                    <!-- 選項按鈕會由 JS 動態生成 -->
                </div>
            </div>

            <!-- 測驗結果畫面 -->
            <div id="result-screen" class="screen hidden">
                <div class="quiz-icon" id="result-icon">🏆</div>
                <h2 class="game-title" style="color: #a55eea;">挑戰結束！</h2>
                <div class="result-score-box">
                    <span class="result-label">最終得分</span>
                    <span id="final-score" class="result-score">0</span>
                </div>
                <p id="evaluation" class="game-desc" style="font-weight: bold; margin-top: 15px;">評語載入中...</p>
                <button id="restart-btn" class="play-btn" style="margin: 25px auto 0;">再試一次</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a href="../index.html" class="btn"
                style="background: #a55eea; box-shadow: 0 8px 20px rgba(165, 94, 234, 0.4);">🎀 回到溫暖的家</a>
        </div>
    </div>
    <script src="../effects.js"></script>
    <script src="game.js"></script>
</body>

</html>
