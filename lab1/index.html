<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 1 - 音樂猜猜樂</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../effects.css">
    <link rel="stylesheet" href="game.css">
</head>
<body class="lab stage-1">
    <div class="window" style="max-width: 800px; padding: 20px;">
        <h1 class="lab-title">🎵 音樂猜猜樂</h1>
        
        <div id="game-container">
            <!-- 開始畫面 -->
            <div id="start-screen" class="screen">
                <h2 class="game-title">猜歌挑戰</h2>
                <p class="game-desc">聽一小段音樂，猜出正確的歌名！<br>總共有 3 首歌喔～🐻</p>
                <button id="start-btn" class="play-btn" style="margin: 0 auto;">開始挑戰</button>
            </div>

            <!-- 遊戲畫面 -->
            <div id="game-screen" class="screen hidden">
                <div class="progress" id="progress-text">第 1 / 3 題</div>
                
                <div id="music-player-ui">
                    <div class="record" id="record"></div>
                    <button id="play-btn" class="play-btn">
                        <span id="play-icon">▶ 播放音樂</span>
                    </button>
                </div>
                
                <div id="status-text" class="status-text">聽聽看，這是哪首歌？</div>
                
                <div id="options-container">
                    <!-- 選項按鈕會由 JS 動態生成 -->
                </div>
            </div>

            <!-- 結束畫面 -->
            <div id="end-screen" class="screen hidden">
                <h2 class="game-title" style="color: #2a9d8f;">挑戰結束！</h2>
                <p id="final-score" class="game-title" style="font-size: 1.8rem; margin: 20px 0;">你的總分是：0 分！</p>
                <p id="evaluation" class="game-desc" style="font-weight: bold;"></p>
                <button id="restart-btn" class="play-btn" style="margin: 0 auto;">再玩一次</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="../index.html" class="btn">🎀 回到溫暖的家</a>
        </div>
    </div>
    <script src="../effects.js"></script>
    <script src="game.js"></script>
</body>
</html>
